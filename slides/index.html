			Reveal.on( 'slidechanged', event => {
				const current = event.currentSlide;
				const background = current?.slideBackgroundContentElement?.closest(".stack")?.querySelector(".slide-background-content");
				
				console.log("SLIDE", current);
				
				if(background) {
					if(current?.dataset?.state === "focus-bg") {
						background.classList.add("focus");
						background.classList.remove("blur");
					} else {
						background.classList.add("blur");
						background.classList.remove("focus");
					}
				}
			} );

<style>
	ul.nostyle {
  list-style-type: none;
}
@property --p{
syntax: '<number>';
inherits: true;
initial-value: 0;
}

.pie {
--p:20;
--b:22px;
--c:darkred;
--w:400px;

width:var(--w);
aspect-ratio:1;
position:relative;
display:inline-grid;
margin:5px;
place-content:center;
font-size:25px;
font-weight:bold;
font-family:sans-serif;
}
.pie:before,
.pie:after {
content:"";
position:absolute;
border-radius:50%;
}
.pie:before {
inset:0;
background:
radial-gradient(farthest-side,var(--c) 98%,#0000) top/var(--b) var(--b) no-repeat,
conic-gradient(var(--c) calc(var(--p)*1%),#0000 0);
-webkit-mask:radial-gradient(farthest-side,#0000 calc(99% - var(--b)),#000 calc(100% - var(--b)));
mask:radial-gradient(farthest-side,#0000 calc(99% - var(--b)),#000 calc(100% - var(--b)));
}
.pie:after {
inset:calc(50% - var(--b)/2);
background:var(--c);
transform:rotate(calc(var(--p)*3.6deg)) translateY(calc(50% - var(--w)/2));
}
.present .animate {
animation:pin 1s 0.5s both;
}
.future .animate, .past .animate {
animation:pout 1s 0.5s both;
}

.no-round:before {
background-size:0 0,auto;
}
.no-round:after {
content:none;
}
@keyframes pin {
from{--p:0}
to{--p:58}
}
@keyframes pout {
from{--p:58}
to{--p:0}
}
body {
font-family:sans-serif;
}
